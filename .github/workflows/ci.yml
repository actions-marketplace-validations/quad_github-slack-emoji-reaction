name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: pre-pull act image
        run: docker pull catthehacker/ubuntu:act-latest
      - run: npm ci
      - run: npm run ci
