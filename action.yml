name: github-slack-emoji-reaction
description: React on Slack messages linking to a GitHub PR with PR-status emoji.
inputs:
  slack-token:
    required: true
    description: Slack bot token (xoxb-…) with channels:read, groups:read, channels:history, groups:history, reactions:read, reactions:write.
  github-token:
    required: false
    default: ${{ github.token }}
    description: GitHub token for reading PR state; defaults to the workflow's GITHUB_TOKEN. Needs pull-requests:read.
  emoji-approved:
    required: false
    default: white_check_mark
    description: Emoji name (no colons) for approved reviews; empty to disable.
  emoji-changes-requested:
    required: false
    default: warning
    description: Emoji for changes-requested reviews; empty to disable.
  emoji-commented:
    required: false
    default: speech_balloon
    description: Emoji for comment-only reviews; empty to disable.
  emoji-merged:
    required: false
    default: rocket
    description: Emoji for merged PRs; empty to disable.
  emoji-closed:
    required: false
    default: x
    description: Emoji for closed-without-merge PRs; empty to disable.
runs:
  using: node24
  main: src/index.js
